<!doctype html>
<html lang="en" data-preview="zip">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LongPage Snap ZIP choice preview</title>
  <style>html,body{margin:0;padding:0;font:16px/1.5 system-ui;}
    body{background:#f7f7f7;color:#202020;padding:16px;}</style>
</head>
<body>
  <main><h1>Long-page test</h1><p>ZIP export choice after a 10-part capture.</p></main>
  <script src="/test/fixtures/mock-browser.js"></script>
  <script src="/src/locales.js"></script>
  <script src="/src/zip.js"></script>
  <script src="/src/content.js"></script>
  <script>
    (async () => {
      await window.captureMessage({
        scope:"longpage-snap",type:"begin",
        settings:{language:"fr",mode:"automatic"},
      });
      await window.captureMessage({
        scope:"longpage-snap",type:"complete",
        filename:"sample.jpg",parts:10,exportId:"zip-preview",
        zipEligible:true,
      });
    })();
  </script>
  <script src="/test/fixtures/mobile-metrics.js"></script>
</body>
</html>
