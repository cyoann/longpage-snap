name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=high
      - name: Full automated QA: syntax, tests, lint, build, UI and lab
        run: npm run qa:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longpage-mobile-inspection
          path: |
            .mobile-check/*-390.png
            .site-preview/*.png
            .qa-results/desktop-ci-report.json
          if-no-files-found: warn
          include-hidden-files: true
