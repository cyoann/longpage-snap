name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npx web-ext lint
      - run: npx web-ext build
